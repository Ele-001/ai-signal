[package]
name = "ai-signal"
version = "0.1.4"
description = "A small desktop signal for AI work"
authors = ["AI Signal"]
edition = "2021"

[lib]
name = "ai_signal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
