<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="775" viewBox="0 0 1320 775" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.attention-ring{opacity:0}.signal-completed .lamp-active{opacity:.58}</style><rect width="1320" height="775" fill="#f5f5f7"/><text x="40" y="65" font-size="34" fill="#1d1d1f" font-weight="650">红灯何时自动解除</text><text x="40" y="102" font-size="19" fill="#6e6e73" font-weight="400">只有阻塞解除或出现可靠的新状态，才会重新汇总灯色。</text><svg x="68" y="205" width="142" height="276" class="signal signal-classic  signal-attention signal-static" viewBox="0 0 150 292" role="img" aria-label="信号灯：attention"><defs><linearGradient id="guide-attention-signal-_R_0_-rim" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#d0d1d1"></stop><stop offset=".13" stop-color="#a3a5a5"></stop><stop offset=".42" stop-color="#bfc1c1"></stop><stop offset=".73" stop-color="#7d8082"></stop><stop offset="1" stop-color="#b4b6b7"></stop></linearGradient><linearGradient id="guide-attention-signal-_R_0_-body" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#303134"></stop><stop offset=".25" stop-color="#222326"></stop><stop offset=".7" stop-color="#161719"></stop><stop offset="1" stop-color="#202123"></stop></linearGradient><linearGradient id="guide-attention-signal-_R_0_-socket" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#08090a"></stop><stop offset=".48" stop-color="#141517"></stop><stop offset="1" stop-color="#4c4d4f"></stop></linearGradient><linearGradient id="guide-attention-signal-_R_0_-glass-reflection" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff" stop-opacity=".42"></stop><stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop></linearGradient><g><radialGradient id="guide-attention-signal-_R_0_-on-0" cx="38%" cy="27%" r="78%"><stop stop-color="#ff9a85"></stop><stop offset=".45" stop-color="#f34135"></stop><stop offset="1" stop-color="#8b1917"></stop></radialGradient><radialGradient id="guide-attention-signal-_R_0_-off-0" cx="40%" cy="24%" r="85%"><stop stop-color="#493035"></stop><stop offset=".55" stop-color="#28171b"></stop><stop offset="1" stop-color="#150d10"></stop></radialGradient></g><g><radialGradient id="guide-attention-signal-_R_0_-on-1" cx="38%" cy="27%" r="78%"><stop stop-color="#fff8b3"></stop><stop offset=".45" stop-color="#f5c439"></stop><stop offset="1" stop-color="#8b6016"></stop></radialGradient><radialGradient id="guide-attention-signal-_R_0_-off-1" cx="40%" cy="24%" r="85%"><stop stop-color="#403a29"></stop><stop offset=".55" stop-color="#282315"></stop><stop offset="1" stop-color="#16130c"></stop></radialGradient></g><g><radialGradient id="guide-attention-signal-_R_0_-on-2" cx="38%" cy="27%" r="78%"><stop stop-color="#c8ffc0"></stop><stop offset=".45" stop-color="#59d16b"></stop><stop offset="1" stop-color="#176434"></stop></radialGradient><radialGradient id="guide-attention-signal-_R_0_-off-2" cx="40%" cy="24%" r="85%"><stop stop-color="#2b4235"></stop><stop offset=".55" stop-color="#172a20"></stop><stop offset="1" stop-color="#0d1711"></stop></radialGradient></g></defs><rect x="20" y="4" width="110" height="284" rx="55" fill="url(#guide-attention-signal-_R_0_-rim)" stroke="#9b9d9f" stroke-width="1"></rect><rect x="26" y="10" width="98" height="272" rx="49" fill="url(#guide-attention-signal-_R_0_-body)" stroke="#0a0b0c" stroke-width="1"></rect><path d="M28 59a47 47 0 0 1 47-47" fill="none" stroke="#b5b6b7" stroke-opacity=".16" stroke-width="1.2" stroke-linecap="round"></path><path d="M126 231a51 51 0 0 1-51 53" fill="none" stroke="#77797b" stroke-opacity=".22" stroke-width="1" stroke-linecap="round"></path><g><circle cx="75" cy="60" r="38" fill="url(#guide-attention-signal-_R_0_-socket)" stroke="#0b0c0d" stroke-width="1.2"></circle><circle cx="75" cy="60" r="34" fill="#080a09" stroke="#636568" stroke-opacity=".3" stroke-width=".7"></circle><g class="lamp lamp-active"><circle cx="75" cy="60" r="32" fill="url(#guide-attention-signal-_R_0_-on-0)" stroke="#060808" stroke-width=".8"></circle><path d="M49 55c1-16 12-25 26-25s25 9 26 25c-8-7-18-10-26-10S57 48 49 55Z" fill="url(#guide-attention-signal-_R_0_-glass-reflection)" opacity="0.8"></path><ellipse cx="64" cy="42" rx="9" ry="3.2" fill="#ffffff" opacity="0.23" transform="rotate(-27 64 42)"></ellipse><path d="M56 83a29 29 0 0 0 35-1" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width=".9" stroke-linecap="round"></path></g><circle class="attention-ring" cx="75" cy="60" r="36.5" fill="none" stroke="#ff6b5d" stroke-width="1.5"></circle></g><g><circle cx="75" cy="143" r="38" fill="url(#guide-attention-signal-_R_0_-socket)" stroke="#0b0c0d" stroke-width="1.2"></circle><circle cx="75" cy="143" r="34" fill="#080a09" stroke="#636568" stroke-opacity=".3" stroke-width=".7"></circle><g class="lamp "><circle cx="75" cy="143" r="32" fill="url(#guide-attention-signal-_R_0_-off-1)" stroke="#060808" stroke-width=".8"></circle><path d="M49 138c1-16 12-25 26-25s25 9 26 25c-8-7-18-10-26-10S57 131 49 138Z" fill="url(#guide-attention-signal-_R_0_-glass-reflection)" opacity="0.18"></path><ellipse cx="64" cy="125" rx="9" ry="3.2" fill="#ffffff" opacity="0.045" transform="rotate(-27 64 125)"></ellipse><path d="M56 166a29 29 0 0 0 35-1" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width=".9" stroke-linecap="round"></path></g></g><g><circle cx="75" cy="226" r="38" fill="url(#guide-attention-signal-_R_0_-socket)" stroke="#0b0c0d" stroke-width="1.2"></circle><circle cx="75" cy="226" r="34" fill="#080a09" stroke="#636568" stroke-opacity=".3" stroke-width=".7"></circle><g class="lamp "><circle cx="75" cy="226" r="32" fill="url(#guide-attention-signal-_R_0_-off-2)" stroke="#060808" stroke-width=".8"></circle><path d="M49 221c1-16 12-25 26-25s25 9 26 25c-8-7-18-10-26-10S57 214 49 221Z" fill="url(#guide-attention-signal-_R_0_-glass-reflection)" opacity="0.18"></path><ellipse cx="64" cy="208" rx="9" ry="3.2" fill="#ffffff" opacity="0.045" transform="rotate(-27 64 208)"></ellipse><path d="M56 249a29 29 0 0 0 35-1" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width=".9" stroke-linecap="round"></path></g></g></svg><text x="69" y="530" font-size="22" fill="#bd342c" font-weight="600">红灯常亮</text><circle cx="300" cy="157" r="5" fill="#e44338"/><text x="320" y="164" font-size="21" fill="#1d1d1f" font-weight="600">等待用户处理</text><text x="320" y="200" font-size="19" fill="#1d1d1f" font-weight="400">解除条件：回答问题，或处理已接入的审批</text><text x="320" y="230" font-size="17" fill="#6e6e73" font-weight="400">全部待答项解除后，按任务当前状态切换。</text><path d="M300 254H1280" stroke="#dedee3"/><circle cx="300" cy="279" r="5" fill="#e44338"/><text x="320" y="286" font-size="21" fill="#1d1d1f" font-weight="600">工作期间锁屏或监测中断</text><text x="320" y="322" font-size="19" fill="#1d1d1f" font-weight="400">解除条件：桌面恢复可用，且所有受影响原任务恢复或结束</text><text x="320" y="352" font-size="17" fill="#6e6e73" font-weight="400">仅解锁不会清除仍然受阻的任务；无关任务的进度不算恢复。</text><path d="M300 376H1280" stroke="#dedee3"/><circle cx="300" cy="401" r="5" fill="#e44338"/><text x="320" y="408" font-size="21" fill="#1d1d1f" font-weight="600">连续 2 分钟没有新进展</text><text x="320" y="444" font-size="19" fill="#1d1d1f" font-weight="400">解除条件：同一个任务收到新进展，或明确报告结束</text><text x="320" y="474" font-size="17" fill="#6e6e73" font-weight="400">长耗时操作也可能触发“状态待确认”，不代表已经确认失败。</text><path d="M300 498H1280" stroke="#dedee3"/><circle cx="300" cy="523" r="5" fill="#e44338"/><text x="320" y="530" font-size="21" fill="#1d1d1f" font-weight="600">连接或状态读取异常</text><text x="320" y="566" font-size="19" fill="#1d1d1f" font-weight="400">解除条件：对应来源、接收端或内部连接实际恢复</text><text x="320" y="596" font-size="17" fill="#6e6e73" font-weight="400">故障恢复后自动解除，无需手动清除提醒。</text><path d="M40 660H1280" stroke="#dedee3"/><text x="40" y="700" font-size="22" fill="#287a3d" font-weight="500">恢复运行 → 绿闪　　明确结束 → 绿常亮　　空闲 → 全灭</text><text x="40" y="739" font-size="17" fill="#6e6e73" font-weight="400">仍有其他待处理项时，汇总继续红灯。手动模拟任务需手动切换；未接入的事件无法保证即时识别。</text></svg>